[package]
name = "bv-auth-ferrogate"
version = "0.1.0"
edition = "2021"
description = "BastionVault's FerroGate machine-identity auth backend (CMIS, SVID, DPoP)"
license = "Apache-2.0"
repository = "https://github.com/ffquintella/BastionVault"

publish = ["uox-bastionvault"]

# Tier 3 of the workspace decomposition
# (roadmaps/workspace-decomposition.md § Phase 3).
#
# The one auth backend that depends on a second private registry: the `ferro-*`
# SDK crates come from `uox-ferrogate`, not `uox-bastionvault`. See
# docs/publishing-crates.md § Known constraints.

[dependencies]
bv-errors = { path = "../bv-errors", version = "0.1.0", registry = "uox-bastionvault" }
bv-context = { path = "../bv-context", version = "0.1.0", registry = "uox-bastionvault" }
bv-logical = { path = "../bv-logical", version = "0.1.0", registry = "uox-bastionvault" }
bv-storage = { path = "../bv-storage", version = "0.1.0", registry = "uox-bastionvault" }
bv-kernel-api = { path = "../bv-kernel-api", version = "0.1.0", registry = "uox-bastionvault" }
# The FerroGate deny-reason counters live in the metrics substrate, next to
# every other metric family, so this backend takes `bv-metrics` directly
# rather than reaching through the root crate's re-export.
bv-metrics = { path = "../bv-metrics", version = "0.1.0", registry = "uox-bastionvault" }

async-trait = "0.1"
derive_more = "2.1.1"
log = "0.4"
maybe-async = "0.2"
serde = { version = "^1.0", features = ["derive", "rc", "alloc"] }
serde_json = "^1.0"
arc-swap = "1.7"
dashmap = "6.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http2"] }
hyper-util = "0.1"
base64 = "0.22"
blake3 = "1.8"
ipnetwork = { version = "0.21", features = ["serde"] }
ed25519-dalek = "2"
# The FerroGate SDK, from the same private registry the root crate takes it
# from. Pinned exactly for the reason the root manifest records: the two
# verifiers each require `ferro-crypto =0.21.5`.
ferro-child-verify = { version = "=0.21.5", registry = "uox-ferrogate" }
ferro-crypto = { version = "=0.21.5", registry = "uox-ferrogate" }
ferro-svid-verify = { version = "=0.21.5", registry = "uox-ferrogate" }
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
prost = "0.14"
rustls = { version = "0.23.37", features = ["aws_lc_rs"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
tonic-prost = "0.14"

[features]
default = []
sync_handler = [
    "maybe-async/is_sync",
    "bv-storage/sync_handler",
    "bv-logical/sync_handler",
    "bv-kernel-api/sync_handler",
]

# Lints this crate's code trips, all of which the root crate already allows.
[lints.clippy]
field_reassign_with_default = "allow"
type_complexity = "allow"

[package.metadata.cargo-machete]
ignored = [
    # Pulled in by the `#[maybe_async::maybe_async]` attribute's async
    # expansion, which is a token stream to a static `use` scan.
    "async-trait",
]

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
