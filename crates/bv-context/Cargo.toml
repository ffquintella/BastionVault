[package]
name = "bv-context"
version = "0.41.0"
edition = "2021"
description = "BastionVault's generic keyed context store and task registry"
license = "Apache-2.0"
repository = "https://github.com/ffquintella/BastionVault"

publish = ["uox-bastionvault"]

# Not in the roadmap's Tier 0 list, but it belongs there: `src/context.rs`
# references nothing from the monolith except `crate::errors`, and
# `bv-logical` cannot be extracted without it (`Request`, `Path`, `Backend`
# and `logical::mod` all take a `&Context`). See
# roadmaps/workspace-decomposition.md § Phase 1.
[dependencies]
bv-errors = { path = "../bv-errors", version = "0.41.0", registry = "uox-bastionvault" }
dashmap = "6.1"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
