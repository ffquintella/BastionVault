[package]
name = "bv-plugin-pack"
version = "0.41.1"
edition = "2021"
description = "Pack a plugin.toml + .wasm into a .bvplugin bundle so the GUI can self-configure on upload."
license = "Apache-2.0"
repository = "https://github.com/ffquintella/BastionVault"

# Pinned to the Cloudsmith registry so a bare `cargo publish` cannot
# leak this crate to crates.io. See docs/publishing-crates.md.
publish = ["uox-bastionvault"]

[[bin]]
name = "bv-plugin-pack"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml = "1.1"
sha2 = "0.11"
# ML-DSA-65 signing for the optional `--signing-seed-hex` /
# `--signing-key-name` mode. Same provider the host's verifier uses so
# the signature is byte-identical to what the host expects.
bv_crypto = { version = "0.41.0", path = "../bv_crypto", registry = "uox-bastionvault" }
# Shared manifest type + canonical `signing_message`, used verbatim by
# the host verifier. Signing through it guarantees the host re-derives a
# byte-identical message, so a signed bundle verifies.
bv_plugin_manifest = { version = "0.41.0", path = "../bv-plugin-manifest", registry = "uox-bastionvault" }
hex = "0.4"
