[package]
name = "bv-auth-oidc"
version = "0.41.5"
edition = "2021"
description = "BastionVault's OIDC auth backend"
license = "Apache-2.0"
repository = "https://github.com/ffquintella/BastionVault"

publish = ["uox-bastionvault"]

# Tier 3 of the workspace decomposition
# (roadmaps/workspace-decomposition.md § Phase 3).

[dependencies]
bv-errors = { path = "../bv-errors", version = "0.41.0", registry = "uox-bastionvault" }
bv-context = { path = "../bv-context", version = "0.41.0", registry = "uox-bastionvault" }
bv-logical = { path = "../bv-logical", version = "0.42.0", registry = "uox-bastionvault" }
bv-storage = { path = "../bv-storage", version = "0.41.0", registry = "uox-bastionvault" }
bv-utils = { path = "../bv-utils", version = "0.41.0", registry = "uox-bastionvault" }
bv-kernel-api = { path = "../bv-kernel-api", version = "0.42.0", registry = "uox-bastionvault" }
bv-auth-audit = { path = "../bv-auth-audit", version = "0.41.0", registry = "uox-bastionvault" }

async-trait = "0.1"
derive_more = "2.1.1"
log = "0.4"
maybe-async = "0.2"
serde = { version = "^1.0", features = ["derive", "rc", "alloc"] }
serde_json = "^1.0"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
# The opt-in legacy TLS 1.2 CBC client (T551, features/legacy-tls-cbc.md):
# used only by a mount with `oidc_discovery_legacy_tls = true`, and only in a
# build with the `legacy-tls` feature below. Tier 0, no workspace deps.
bv-tls-legacy = { path = "../bv-tls-legacy", version = "0.41.0", registry = "uox-bastionvault", optional = true }

[dev-dependencies]
# `http_client`'s tests mint a throwaway CA chain and terminate TLS on
# loopback, so the `oidc_discovery_ca_pem` trust path is proven by a real
# handshake rather than by inspecting the client builder. All three are
# already in the graph (same pins as bv-engine-resource's test server); the
# server's provider is aws-lc-rs, which bv-errors' rustls already enables.
rcgen = "0.14"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }

[features]
default = []
# Compiles in the legacy TLS 1.2 CBC client for IdPs that offer only
# ECDHE-RSA AES-CBC suites. Off by default; even when on, a mount uses it only
# when its config sets `oidc_discovery_legacy_tls`. Never a fallback.
legacy-tls = ["dep:bv-tls-legacy"]
sync_handler = [
    "maybe-async/is_sync",
    "bv-storage/sync_handler",
    "bv-logical/sync_handler",
    "bv-utils/sync_handler",
    "bv-kernel-api/sync_handler",
    "bv-auth-audit/sync_handler",
]

# Lints this crate's code trips, all of which the root crate already allows.
[lints.clippy]
field_reassign_with_default = "allow"
type_complexity = "allow"

[package.metadata.cargo-machete]
ignored = [
    # Pulled in by the `#[maybe_async::maybe_async]` attribute's async
    # expansion, which is a token stream to a static `use` scan.
    "async-trait",
]
