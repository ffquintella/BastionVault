[package]
name = "bv-engine-idp"
version = "0.41.0"
edition = "2021"
description = "BastionVault's outbound identity provider: canonical workforce identities with a stable, never-reused POSIX uid/gid mapping"
license = "Apache-2.0"
repository = "https://github.com/ffquintella/BastionVault"

publish = ["uox-bastionvault"]

# Tier 3 (roadmaps/workspace-decomposition.md § Phase 3): bv-kernel-api, Tier 0
# and sibling bv-auth-saml. features/identity-provider.md (T52, S19), Phase 1: the POSIX
# identity core; Phase 2: environments, entitlements and the issue gate;
# Phase 3: SSH identity certificates, the KRL and the signed deny feed.
# Phase 4: the RADIUS provider. Phase 5: SAML IdP and OIDC OP (aws-lc signs,
# bv-auth-saml canonicalises). Phase 6: the LDAP directory. No primitive here.

[dependencies]
bv-errors = { path = "../bv-errors", version = "0.41.0", registry = "uox-bastionvault" }
# `Context` is named by the `new_path!` expansion.
bv-context = { path = "../bv-context", version = "0.41.0", registry = "uox-bastionvault" }
bv-logical = { path = "../bv-logical", version = "0.42.0", registry = "uox-bastionvault" }
bv-storage = { path = "../bv-storage", version = "0.41.0", registry = "uox-bastionvault" }
bv-kernel-api = { path = "../bv-kernel-api", version = "0.42.0", registry = "uox-bastionvault" }
# Phase 2: the issue gate writes `idp.issue` / `idp.issue-denied` as
# `AuditEntry::event` entries on the broker, the same path engine events use.
bv-audit = { path = "../bv-audit", version = "0.42.0", registry = "uox-bastionvault" }

arc-swap = "1.7"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
derive_more = "2.1.1"
log = "0.4"
maybe-async = "0.2"
serde = { version = "^1.0", features = ["derive", "rc", "alloc"] }
serde_json = "^1.0"
# Process-local half of the allocator lock; the storage lock is the
# cluster-wide half. Same version line as the other engines. Phase 4 adds
# `net`, `io-util`, `time`, `rt` and `macros` for the RADIUS listeners
# (UDP socket, RadSec TCP accept loop, timeouts, the supervisor's select).
tokio = { version = "1.52", features = ["sync", "net", "io-util", "time", "rt", "macros"] }

# Phase 3. All already in the workspace graph (no new crate is built).
# Composite Ed25519 + ML-DSA-65 detached signature over the deny feed
# (`bv_crypto::bvrg::{sign,verify}_detached_hybrid`); pure Rust.
bv_crypto = { path = "../bv_crypto", version = "0.42.0", registry = "uox-bastionvault" }
# Rebuilds the stored Ed25519 half of the feed key (`SigningKey::from_bytes`),
# the type bv_crypto's signer holds. Same features as bv_crypto's own.
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
# Parse the certificate the SSH engine returns (principals, key id,
# extensions, signing CA) and the client public key; wire-encode the CA key
# for the KRL. Same features as bv-kernel-api's.
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "ecdsa"] }
base64 = "0.23"
# Content digest of the deny feed, so its version moves only on a change.
sha2 = "0.11"
humantime = "2.3"
zeroize = "1.8"

# Phase 4 (RADIUS provider). Every crate below is already in the lockfile.
# RFC 2865 / RFC 3579 define MD5 (User-Password hiding, Response
# Authenticator) and HMAC-MD5 (Message-Authenticator); they are the
# protocol's, not a choice made here. RustCrypto, pure Rust, the versions
# sspi and postgres-protocol already lock. RadSec (TLS) is the default
# transport, so these only authenticate packets inside a TLS session unless
# an operator opts in to UDP.
md-5 = "0.11"
hmac = "0.13"
# RadSec (RFC 6614) listener. Same declaration as bv-hsm-link: the aws-lc-rs
# provider every crate already links through bv-errors' rustls, no second
# crypto backend and no new C dependency.
rustls = { version = "0.23.37", features = ["aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
# One-time RADIUS passcodes: the same CSPRNG source the SSH engine's OTPs use.
rand = "0.10"

# Phase 5 (SAML IdP + OIDC OP). Every crate below is already in the lockfile;
# no new C dependency.
# The SAML auth backend's exclusive XML C14N (`verify::canonicalise_exclusive`)
# and, in tests, its Response parser and signature verifier: the IdP signs
# with the canonicaliser the SP side verifies with, never a second one.
bv-auth-saml = { path = "../bv-auth-saml", version = "0.41.5", registry = "uox-bastionvault" }
# RSA-3072 key generation and RSASSA-PKCS1-v1_5 SHA-256 signing (XML-DSig
# rsa-sha256, JWS RS256). The constant-time aws-lc backend rustls already
# links here, instead of RustCrypto `rsa` (RUSTSEC-2023-0071, no fix).
aws-lc-rs = "1"
# Self-signed X.509 certificate around the SAML signing key, for metadata.
# Default (ring) features, as the root and the dev-dependency declare it, so
# no other crate's rcgen or x509-parser feature set changes.
rcgen = "0.14"
# HTTP-Redirect binding: raw DEFLATE of an inbound AuthnRequest.
flate2 = "1"
# AuthnRequest parsing (namespace-aware), as bv-auth-saml.
quick-xml = "0.42"
# Validates registered ACS and redirect URIs and builds the code redirect.
url = "2"

[dev-dependencies]
# An independent OpenID relying-party library checks the OP's discovery
# document, JWKS and ID tokens (RustCrypto RSA, not aws-lc). No HTTP client.
openidconnect = { version = "4", default-features = false }
# Throwaway CA, server and NAS certificates for the RadSec listener test.
# Same declaration as bv-hsm-link's dev-dependency.
rcgen = "0.14"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync"] }
# The unit tests' stand-in for the SSH engine signs with an in-memory CA.
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "ecdsa", "getrandom"] }
# Phase 6: an independent LDAP client checks the directory's listeners
# (LDAPS, StartTLS, cleartext, binds, searches, refused writes) against a
# codec the server does not share. Same declaration as bv-engine-ldap's
# dependency, so no new crate or feature enters the graph.
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls-rustls-aws-lc-rs"] }

[features]
default = []
sync_handler = [
    "maybe-async/is_sync",
    "bv-storage/sync_handler",
    "bv-logical/sync_handler",
    "bv-kernel-api/sync_handler",
    "bv-audit/sync_handler",
]

# Lints this crate's code trips, all of which the root crate already allows.
# Per-crate rather than a `[workspace.lints]` block (see bv-logical's manifest).
[lints.clippy]
field_reassign_with_default = "allow"
type_complexity = "allow"

[package.metadata.cargo-machete]
ignored = [
    # Used by the `#[maybe_async::maybe_async]` expansion, invisible to a scan.
    "async-trait",
    # Package name != lib name: the crate is `md-5`, the lib is `md5`.
    "md-5",
]
