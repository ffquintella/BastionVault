[package]
name = "bv-engine-transit"
version = "0.1.0"
edition = "2021"
description = "BastionVault's Transit engine: encryption as a service, key derivation and BYOK"
license = "Apache-2.0"
repository = "https://github.com/ffquintella/BastionVault"

publish = ["uox-bastionvault"]

# Tier 3 of the workspace decomposition
# (roadmaps/workspace-decomposition.md § Phase 3).
#
# 19 files, and zero commits in the last 300 — the most self-contained engine
# in the tree, which is why it needed no inversion at all.

[dependencies]
bv-errors = { path = "../bv-errors", version = "0.1.0", registry = "uox-bastionvault" }
bv-context = { path = "../bv-context", version = "0.1.0", registry = "uox-bastionvault" }
bv-logical = { path = "../bv-logical", version = "0.1.0", registry = "uox-bastionvault" }
bv-storage = { path = "../bv-storage", version = "0.1.0", registry = "uox-bastionvault" }
bv-utils = { path = "../bv-utils", version = "0.1.0", registry = "uox-bastionvault" }
bv-kernel-api = { path = "../bv-kernel-api", version = "0.1.0", registry = "uox-bastionvault" }
bv_crypto = { path = "../bv_crypto", version = "0.1.0", registry = "uox-bastionvault" }

async-trait = "0.1"
derive_more = "2.1.1"
log = "0.4"
maybe-async = "0.2"
serde = { version = "^1.0", features = ["derive", "rc", "alloc"] }
serde_json = "^1.0"
base64 = "0.22"
ed25519-dalek = "2"
fips204 = { version = "0.4", default-features = false, features = ["default-rng", "ml-dsa-44", "ml-dsa-65", "ml-dsa-87"] }
hkdf = "0.13"
hmac = "0.13"
rand = "^0.10"
sha2 = "0.11"
subtle = "2.6"
# X25519 for the optional `hybrid-x25519+ml-kem-768` key type. Optional for
# the same reason as in the root manifest: only `transit_pqc_hybrid` pays.
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }

[features]
default = []
# Bring-your-own-key import and the hybrid PQC key types, both off by default.
transit_byok = []
transit_pqc_hybrid = ["dep:x25519-dalek"]
sync_handler = [
    "maybe-async/is_sync",
    "bv-storage/sync_handler",
    "bv-logical/sync_handler",
    "bv-utils/sync_handler",
    "bv-kernel-api/sync_handler",
]

# Lints this crate's code trips, all of which the root crate already allows.
# Per-crate rather than a `[workspace.lints]` block, for the reason recorded in
# `bv-logical`'s manifest.
[lints.clippy]
field_reassign_with_default = "allow"
type_complexity = "allow"

[package.metadata.cargo-machete]
ignored = [
    # Pulled in by the `#[maybe_async::maybe_async]` attribute's async
    # expansion, which is a token stream to a static `use` scan.
    "async-trait",
]
