[package]
name = "bastion-plugin-postgres"
# 0.2: rebased on bastion-plugin-dynamic-sdk (secret/dynamic, ABI 1.5). The
# 0.1.x line is the Phase 4 reference in plugins-ext/.
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PostgreSQL dynamic-credential engine for BastionVault (secret/dynamic, engine_type = database). Process runtime."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "bastion-plugin-postgres"
path = "src/main.rs"

[dependencies]
bastion-plugin-dynamic-sdk = { path = "../bastion-plugin-dynamic-sdk" }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
# No `with-*` features and no TLS feature: TLS is the rustls connector in
# src/tls.rs, so the plugin pulls neither openssl-sys nor native-tls.
tokio-postgres = { version = "0.7.17", default-features = false, features = ["runtime"] }
# rustls on the `ring` provider: the default `aws_lc_rs` provider would pull
# aws-lc-sys, which dynamic-engine-plugins/ does not accept.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The OS trust store, used when the operator gave no CA for the connection.
rustls-native-certs = "0.8"

[dev-dependencies]
bastion-plugin-dynamic-sdk = { path = "../bastion-plugin-dynamic-sdk", features = ["testing"] }
bastion-plugin-testkit = { path = "../../crates/bastion-plugin-testkit" }
# plugin.toml is checked against the host's own manifest rules.
bv_plugin_manifest = { path = "../../crates/bv-plugin-manifest" }
toml = "1.1"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "io-util"] }
# Test certificates for the TLS verification tests (ring, not aws-lc-rs).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
