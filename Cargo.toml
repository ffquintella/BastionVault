[package]
name = "bastion_vault"
version = "0.42.1"
edition = "2021"
license = "Apache-2.0"
description = """
BastionVault is a powerful identity-based secrets management software, providing features such as
cryptographic key management, encryption as a service, public key cryptography, certificates management, identity credentials
management and so forth.

BastionVault is a fork of RustyVault and reflects a different direction for the library.

BastionVault's RESTful API is designed to be fully compatible with Hashicorp Vault.
"""
repository = "https://github.com/ffquintella/BastionVault"
documentation = "https://docs.rs/bastion_vault/latest/bastion_vault/"
build = "build.rs"
# The facade is NOT publishable, and this is the guard that makes that true
# rather than merely documented. Every other crate carries
# `publish = ["uox-bastionvault"]`, so a bare `cargo publish` cannot reach
# crates.io — but this one had no `publish` key at all, which means "any
# registry", i.e. crates.io by default. Running `cargo publish` in the repo
# root would have tried to push the whole server there.
#
# It is `false` and not `["uox-bastionvault"]` because it cannot go to
# Cloudsmith either, yet: `[patch.crates-io]` points sspi/picky*/hiqlite at
# forks, and a published `bastion_vault` would resolve those from crates.io
# instead — a behaviour change nobody has validated. See
# docs/publishing-crates.md § Known constraints. Flipping this back is one
# line, and `scripts/crates-plan.sh` picks `bv-server` and `bvault-cli` up
# automatically when it happens, because it derives publishability from this
# field rather than from a list.
publish = false
exclude = [
    "docs/*",
]

[workspace]
members = [
    ".",
    "crates/bv-errors",
    "crates/bv-shamir",
    "crates/bv-context",
    "crates/bv-metrics",
    "crates/bv-storage",
    "crates/bv-logical",
    "crates/bv-utils",
    "crates/bv-audit",
    "crates/bv-kernel-api",
    # Tier 2 — the kernel, below the kernel tier and above the substrate.
    # See roadmaps/workspace-decomposition.md § Phase 4.5.
    "crates/bv-core",
    "crates/bv-kernel",
    "crates/bv-engine-pki",
    "crates/bv-auth-audit",
    "crates/bv-auth-approle",
    "crates/bv-auth-userpass",
    "crates/bv-auth-ferrogate",
    "crates/bv-auth-saml",
    "crates/bv-auth-oidc",
    "crates/bv-auth-fido2",
    "crates/bv-auth-cert",
    "crates/bv-engine-rustion",
    "crates/bv-engine-resource",
    "crates/bv-engine-files",
    "crates/bv-engine-notifications",
    "crates/bv-engine-kv",
    "crates/bv-engine-ssh",
    "crates/bv-engine-totp",
    "crates/bv-engine-ssh-broker",
    "crates/bv-engine-ldap",
    "crates/bv-engine-cert-lifecycle",
    "crates/bv-engine-transit",
    # Tier 4 — the assembly layer, above the library rather than below it.
    # See roadmaps/workspace-decomposition.md § Phase 4.
    "crates/bv-server",
    "crates/bvault-cli",
    "crates/bv_crypto",
    "crates/bastion-plugin-sdk",
    "crates/bastion-plugin-testkit",
    "crates/bv-client",
    "crates/bv-plugin-pack",
    "crates/bv-plugin-manifest",
    "crates/bv_plugin_surface",
    # Tier 4, and deliberately outside `crates/`: the downloads site is a
    # standalone binary that links none of the workspace (see
    # features/packaging-distribution-website.md § Module Architecture).
    "cmd/bv-downloads-server",
    "gui/src-tauri",
]
# `plugins-ext/` is a git submodule with its own Cargo workspace
# (BastionVault-Plugins, the Phase-4 reference plugins). It depends on
# `crates/bastion-plugin-sdk` via a relative path, but is built
# separately — its build artefacts shouldn't pollute the host's
# `target/`, and its release-profile (panic=abort, opt=s) shouldn't
# leak into our normal builds.
exclude = ["plugins-ext", "IronRDP", "third_party/hiqlite"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Tier 0 substrate: `RvError`, re-exported as `bastion_vault::errors`.
# See roadmaps/workspace-decomposition.md § Phase 1.
bv-errors = { path = "crates/bv-errors" }
# Tier 0 leaf: Shamir secret sharing, re-exported as `bastion_vault::shamir`.
bv-shamir = { path = "crates/bv-shamir" }
# Tier 0 leaf: re-exported as `bastion_vault::context`.
bv-context = { path = "crates/bv-context" }
# Tier 0 leaf: Prometheus families + registry, re-exported as
# `bastion_vault::metrics`. The actix middleware stays in `src/metrics`.
bv-metrics = { path = "crates/bv-metrics" }
# Tier 0: barriers, physical backends and the read caches. Re-exported as
# `bastion_vault::{storage, cache, schema}`. It owns the backend-specific
# optional deps (diesel, hiqlite, rusty-s3, keyring); the root features of
# the same names below forward to its features, so operators' choices are
# unchanged.
bv-storage = { path = "crates/bv-storage" }
# Tier 0: Request/Response/Backend/Path/Field plus the `Handler` trait they
# carry. Re-exported as `bastion_vault::{logical, handler}`.
bv-logical = { path = "crates/bv-logical" }
# Tier 1: shared helpers (salts, seal boxes, socket addresses, TLS and cert
# utilities). Re-exported as `bastion_vault::utils`.
bv-utils = { path = "crates/bv-utils" }
# Tier 0: audit entries, hash chain, file device and broker fan-out.
# Re-exported as `bastion_vault::audit`, which adds the `sys_emit` glue that
# has to stay above it.
bv-audit = { path = "crates/bv-audit" }
# Tier 1: the kernel contract every engine compiles against — `VaultCtx`,
# `KernelServices`, the `Module` trait, and the routing/mount tables their
# signatures name. See roadmaps/workspace-decomposition.md § Phase 3.
bv-kernel-api = { path = "crates/bv-kernel-api" }
# Tier 2: `Core`, the mount table, the module registry, the seal path and the
# server config model. Re-exported below so `bastion_vault::{core, mount,
# seal, hsm, config, logging, server_info, module_manager}` are unchanged.
bv-core = { path = "crates/bv-core" }
# Tier 2b: the kernel tier — tokens and leases, identity, policy, namespaces,
# resource groups and the `sys/` backend. Above `bv-core`. Re-exported through
# `bastion_vault::modules` so those paths are unchanged.
bv-kernel = { path = "crates/bv-kernel" }
# Tier 3 engines. Each is `bv-kernel-api` plus the Tier 0 substrate plus its
# own domain crates, and nothing else. The root crate depends on them because
# it is the assembly layer that mounts them — and because the kernel tier
# (`system`, `identity`, `auth`) reads a few of their audit stores.
bv-engine-pki = { path = "crates/bv-engine-pki" }
bv-auth-audit = { path = "crates/bv-auth-audit" }
bv-auth-approle = { path = "crates/bv-auth-approle" }
bv-auth-userpass = { path = "crates/bv-auth-userpass" }
bv-auth-ferrogate = { path = "crates/bv-auth-ferrogate" }
bv-auth-saml = { path = "crates/bv-auth-saml" }
bv-auth-oidc = { path = "crates/bv-auth-oidc" }
bv-auth-fido2 = { path = "crates/bv-auth-fido2" }
bv-auth-cert = { path = "crates/bv-auth-cert" }
bv-engine-rustion = { path = "crates/bv-engine-rustion" }
bv-engine-resource = { path = "crates/bv-engine-resource" }
bv-engine-files = { path = "crates/bv-engine-files" }
bv-engine-notifications = { path = "crates/bv-engine-notifications" }
bv-engine-kv = { path = "crates/bv-engine-kv" }
bv-engine-ssh = { path = "crates/bv-engine-ssh" }
bv-engine-totp = { path = "crates/bv-engine-totp" }
bv-engine-ssh-broker = { path = "crates/bv-engine-ssh-broker" }
bv-engine-ldap = { path = "crates/bv-engine-ldap" }
bv-engine-cert-lifecycle = { path = "crates/bv-engine-cert-lifecycle" }
bv-engine-transit = { path = "crates/bv-engine-transit" }
bv_crypto = { path = "crates/bv_crypto" }
bv_plugin_surface = { path = "crates/bv_plugin_surface" }
bv_plugin_manifest = { path = "crates/bv-plugin-manifest" }
# Shared client crate — used by the CLI's `cluster discover`
# subcommand and `HttpOptions::client_with_discovery` for SRV-based
# cluster node selection. The bulk of bv-client (RemoteBackend HTTP
# dispatch, plugin surface fetch, etc.) is GUI-only; the CLI only
# touches `discovery` + `health`.
bv-client = { path = "crates/bv-client" }
anyhow = { version = "^1.0" }
thiserror = { version = "^2.0" }
serde = { version = "^1.0", features = ["derive", "rc", "alloc"] }
serde_json = "^1.0"
serde_bytes = "0.11"
go-defer = "^0.1"
rand = "^0.10"
regex = "1.12"
sysexits = { version = "0.13", features = ["std"] }
build-time = "0.1"
hcl-rs = "0.19"
# Nine dependencies left this manifest in Phase 4 with `src/cli` and the
# `bvault` binary -- clap, env_logger, prettytable, rpassword, serde_yaml,
# toml -- plus ciborium, ipnetwork and uuid, which Phase 3's engine moves had
# already orphaned without anyone noticing. `sysexits` stays: the
# `EXIT_CODE_*` constants below are its `ExitCode`, and `bvault-cli` reads
# them from here.
# `actix-web` and `actix-tls` left this crate in Phase 4, with `src/http` and
# `src/cli`; they are dependencies of `bv-server` and `bvault-cli` now. That
# is the extraction's headline win: `gui/src-tauri` path-depends on this
# crate, so the Tauri host no longer builds a web framework it never serves
# from. See roadmaps/workspace-decomposition.md § Phase 4.
#
# `actix-rt` stays, and is production code: `ExpirationManager::
# start_check_expired_lease_entries` blocks a dedicated thread on an
# `actix_rt::Runtime`. That is tokio's current-thread builder plus a
# `LocalSet`, so it *looks* replaceable the way `MountsMonitor::start` was in
# Phase 3 — but proving the swept future never spawns a local task means
# tracing `revoke_lease_id` through the whole lease graph, and Phase 3 already
# recorded one wrong conclusion from exactly this reasoning (the AppRole tidy
# race). Behaviour preservation wins; it is a small crate and not a web server.
actix-rt = "2.11"
# `std` is explicit, not inherited. `logging.rs` calls `log::set_boxed_logger`,
# which only exists with that feature on. It used to arrive by unification --
# `env_logger` pulled it in -- and when Phase 4 moved the CLI out and dropped
# `env_logger` from this manifest, the root crate kept building only because a
# workspace-wide `cargo check` unified the feature back in from `bvault-cli`.
# `cargo check -p bv-server` (and any downstream consumer) failed. Declare what
# the code actually needs.
log = { version = "0.4", features = ["std"] }
hex = "0.4"
pem = "3.0"
chrono = "0.4"
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
ureq = { version = "3.3", features = ["json", "socks-proxy", "win-system-proxy"] }
# Pure-Rust SMB2/3 client (NTLM auth via the `sspi` crate). Optional —
# enabled by the `files_smb` feature so default builds don't ship the
# SMB stack. No direct C deps; sspi pulls `ring` which we already
# pin via `aws_lc_rs::default_provider().install_default()` at startup.
# Kerberos is intentionally NOT enabled (would pull `reqwest`); NTLM
# covers the corporate Samba / Windows Server use cases this transport
# targets in v1.
smolder-smb-core = { version = "0.3", optional = true }
http = "1"
rustls = { version = "0.23.37", features = ["aws_lc_rs"] }
# PEM parsing for TLS cert / key / CA files via the `PemObject` trait
# (rustls re-exports this crate as `rustls::pki_types`). Replaces the
# unmaintained `rustls-pemfile` (RUSTSEC-2025-0134).
rustls-pki-types = "1"
webpki-roots = { version = "1.0", default-features = true }
base64 = "0.22"
derive_more = "2.1.1"
dashmap = "6.1"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
ctor = "1.0"
better_default = "1.0.5"
prometheus-client = "0.25"
async-trait = "0.1"
maybe-async = { version = "0.2", optional = false }
arc-swap = "1"
hmac = "0.13"
# Reqwest as a direct dep so the Rustion target-health pinger can hit
# the bastion's control-plane `/v1/health` endpoint. Already in the
# tree transitively via openidconnect + hiqlite; listing it here pins
# the feature set explicitly. Rustls-only (no native-tls) so we stay
# off the OpenSSL surface.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.11"
x509-parser = { version = "0.18", features = ["verify"] }
# Pure-Rust WebAuthn RP support (replaces `webauthn-rs`, which transitively
# pulled OpenSSL via `webauthn-attestation-ca`). The in-tree RP lives at
# `src/modules/credential/fido2/rp/` and only handles attestation `none`,
# which is what we always accepted anyway. CBOR for COSE_Key /
# attestationObject parsing comes from `ciborium`; signature verification
# uses the existing `p256` and `ed25519-dalek` deps.
zstd = "0.13"
# Exchange (import/export) module: password-encrypted .bvx files.
# Argon2id is the OWASP-recommended memory-hard KDF; XChaCha20-Poly1305
# pairs with it for AEAD with a 192-bit nonce so random-nonce collisions
# are not a concern even across millions of exports. See
# `features/import-export-module.md`.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "std", "password-hash"] }
chacha20poly1305 = "0.10"
# Scheduled-exports cron parser. Pure-Rust, no system deps. See
# `features/scheduled-exports.md`.
cron = "0.17"
# `uuid` v4 is used for FIDO2 user-handle generation and for the
# scheduled-exports id generation.
# Plugin system v1: WASM runtime via wasmtime. Pure-Rust JIT with fuel
# metering + memory limits + linker-based host capability injection. See
# `features/plugin-system.md`. We disable the cranelift parallel feature
# to keep the dep tree small; cache + pooling-allocator are off until the
# plugin system actually needs them.
wasmtime = { version = "46", default-features = false, features = ["cranelift", "runtime", "wat", "async"] }
# PKI Secret Engine (Phase 1): pure-Rust X.509 + CRL stack. `rcgen`
# handles DER encoding for certs / CSRs / CRLs and provides a `SigningKey`
# trait we plug post-quantum signers into in Phase 2. We use the default
# feature set, which selects `ring` (pure Rust + asm, no C system deps)
# as the classical crypto provider — explicitly *not* `aws_lc_rs`, since
# the build must stay free of `openssl-sys` and `aws-lc-sys`. `time` is
# rcgen's exposed timestamp type; already transitively in the tree.
# See `features/pki-secret-engine.md`.
rcgen = { version = "0.14", features = ["x509-parser"] }
time = { version = "0.3", default-features = false, features = ["std"] }
# PKI Phase 2 (PQC roles): ML-DSA-44/65/87 certs and CRLs. `rcgen` 0.14
# gates its built-in ML-DSA support behind `aws_lc_rs_unstable`, which
# pulls `aws-lc-sys` — forbidden by `features/pki-secret-engine.md`.
# So Phase 2 assembles `TBSCertificate` / `TBSCertList` directly with
# `x509-cert` + `der` and signs the DER bytes with `fips204`. Pure Rust,
# no C system deps. `const-oid` (already transitive via `der`) carries
# the algorithm OIDs.
x509-cert = { version = "0.2", default-features = false, features = ["builder", "pem", "std"] }
fips204 = { version = "0.4", default-features = false, features = ["default-rng", "ml-dsa-44", "ml-dsa-65", "ml-dsa-87"] }
# FerroGate machine-auth backend (`auth/ferrogate/`): the official reference
# verifier for FerroGate's DPoP-bound, composite-signed (Ed25519 + ML-DSA-65)
# child tokens. Resolved from the FerroGate SDK's own Cargo registry,
# `uox-ferrogate` (see `.cargo/config.toml`); until 0.21.5 these were
# vendored under `third_party/ferrogate-sdk-rust/`. Lean — pulls only serde /
# base64 / sha2 / ed25519-dalek / fips204, all already in our tree. No custom
# crypto.
#
# The version requirement is EXACT (`=`) on all three, deliberately. These
# crates are the trust root for machine logins: a `cargo update` must not be
# able to slide a new verifier under us, so a verifier bump stays a reviewable
# commit that moves these lines. (Upstream pins the same way — the two
# verifiers each require `ferro-crypto =0.21.5`.) `Cargo.lock` is gitignored
# here, so THIS is the pin — do not relax it to a caret. Cargo still verifies
# the registry's SHA-256 on download.
ferro-child-verify = { version = "=0.21.5", registry = "uox-ferrogate" }
# Reference verifier for host SVIDs (direct-SVID `accept_svid` mode + CRL
# enforcement via `verify_unrevoked`). Same SDK, same registry.
ferro-svid-verify = { version = "=0.21.5", registry = "uox-ferrogate" }
# `ferro-crypto` (same SDK) provides the hybrid post-quantum TLS provider
# (X25519MLKEM768) and SPKI-pinning verifier used by the `cmis_grpc` JWKS
# source's PQ-TLS transport, plus the composite primitive.
ferro-crypto = { version = "=0.21.5", registry = "uox-ferrogate" }
tower = { version = "0.5", features = ["util"] }
# Phase 5.3: PKCS#8 (`PrivateKeyInfo`) emit/parse for ML-DSA private keys.
# Already transitive in the dep tree via `der` / `x509-cert` / `rsa` / `p256`,
# but promoted to a direct dep so the PKI module's `MlDsaSigner::to_pkcs8_pem`
# / `from_pkcs8_pem` round-trip uses the standard wrapper. The `pem` feature
# pulls in the PEM encode/decode helpers.
pkcs8 = { version = "0.10", features = ["pem", "alloc"] }
# SSH Secret Engine (Phase 1, CA mode): OpenSSH key + certificate
# parsing / encoding / signing on a pure-Rust stack (RustCrypto
# under the hood). `alloc` for heap, `ed25519` for the default CA
# algorithm, `encryption` for armored OpenSSH private-key handling,
# `ecdsa` so clients may submit NIST P-256/384/521 public keys to be
# signed (the CA itself stays Ed25519). Later phases may add `rsa`.
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "ecdsa", "encryption"] }
ssh-encoding = "0.2"
# Transit Secret Engine. Promotes ed25519-dalek + hkdf to direct deps;
# both were already in the transitive tree (ed25519-dalek via ssh-key,
# hkdf via the rsa stack) so the marginal cost is zero. The PQC bits
# (ml-kem-768 / ml-dsa-44/65/87) come through bv_crypto.
ed25519-dalek = "2"
# ECDSA P-256 verification for the PKI ACME server's `ES256` JWS
# account-key algorithm. Promoted from dev-deps to direct deps when
# Phase 6.1 of the ACME spec landed. `digest 0.10` (matches rsa 0.9's
# family). No new C deps; pure-Rust RustCrypto.
# `ecdh` added for the HSM `bv-identity` ECDH used by the HSM-to-HSM
# replication channel and the hybrid-PQC seed derivation (feature
# `hsm_mock` / `hsm_yubihsm2`). Pure-Rust; enables `elliptic-curve/ecdh`.
p256 = { version = "0.13", features = ["ecdsa", "ecdh"], default-features = false }


# YubiHSM 2 client (feature `hsm_yubihsm2`). Pure-Rust, maintained by
# iqlusion; `http` for the yubihsm-connector, `usb` for direct device
# access, `passwords` for password-derived authentication keys. Optional
# so the stock build (and the USB/libusb link dependency) is only paid for
# by operators who enable the hardware backend. See features/hsm-support.md.
# `untested` is required for `Client::derive_ecdh` (the crate gates ECDH
# behind it and flags it experimental). BastionVault needs device ECDH for
# the HSM-to-HSM replication channel and hybrid-PQC seed derivation; the
# `BVAULT_TEST_YUBIHSM=1` suite validates it against real hardware before use.

# Pulled transitively by `yubihsm`'s `usb` feature; declared directly only to
# force the `vendored` feature, which statically compiles libusb from bundled C
# source with the (cross-)toolchain. This keeps the official container image
# self-contained — no libusb-1.0 dev package in the builder and no libusb .so in
# the minimal Wolfi runtime (Linux hotplug uses netlink, so no libudev either).

[build-dependencies]
toml = "1.1.2"

[dev-dependencies]
# Same crate as the normal dependency above; the extra feature exposes
# `bv_storage::{test_support, test}` — the backend fixtures that
# `test_utils` re-exports, and the backend conformance suite that this
# crate's two multi-process backend tests run. Declared here rather than
# in `[dependencies]` so a release build never compiles them.
bv-storage = { path = "crates/bv-storage", features = ["test-support"] }
# The HTTP surface, which Phase 4 moved ABOVE this crate. It is a normal
# dependency in the other direction (`bv-server` -> `bastion_vault`), so this
# is a dependency cycle — legal because it is a *dev* dependency, and it is
# what lets `test_utils::TestHttpServer` and the ~50 tests here that drive a
# real server stay where they are. See
# roadmaps/workspace-decomposition.md § Phase 4.
bv-server = { path = "crates/bv-server", features = ["test-support"] }
serial_test = "3.4"
cucumber = "0.23"
# `ferro-crypto` is a normal dependency (PQ-TLS transport for cmis_grpc); the
# ferrogate tests additionally use its composite primitive to mint fixtures.
# Pulled in for the Phase-3 composite-signature test so we can verify the
# classical ECDSA-P256 half of the composite signature directly. p256 +
# sha2 are already in the dep tree transitively; promoting them keeps the
# test self-contained without inflating the main build's surface.
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.11"
# Phase 5.3 test parses an emitted PQC PKCS#8 PEM directly to confirm the
# inner OCTET STRING really carries the 32-byte ML-DSA seed.
pkcs8 = { version = "0.10", features = ["pem", "alloc"] }
# WebAssembly text-format parser. Used only by plugin runtime tests so we
# can compile small WAT modules inline rather than checking in pre-built
# `.wasm` blobs.
wat = "1"
# ABI-parity guard: tests/test_plugin_testkit_parity.rs drives the
# testkit's conformance module through the real WasmRuntime so the
# mock host in bastion-plugin-testkit cannot drift from
# src/plugins/runtime.rs without failing CI.
bastion-plugin-testkit = { path = "crates/bastion-plugin-testkit" }

[features]
# `ssh_pqc` is on in the default build so the GUI's "Generate CA →
# ML-DSA-65" path works out of the box. The PQC pulls no new external
# deps (bv_crypto + ssh-encoding + base64 are already present), and
# the algorithm is gated at sign time, so an admin who never picks
# ML-DSA-65 from the dropdown pays no runtime cost. Operators who
# want to ship a smaller binary can override with `--no-default-features
# --features storage_hiqlite` at their own workspace level.
default = ["storage_hiqlite", "ssh_pqc"]
# Forwards to `bv-errors/storage_mysql` so the two MySQL-only `RvError`
# variants (`ErrConnectionPoolCreate`, `ErrDatabaseExecuteEntry`) are
# compiled in exactly when the backend is.
storage_mysql = ["bv-errors/storage_mysql", "bv-storage/storage_mysql"]
storage_hiqlite = ["bv-storage/storage_hiqlite"]
# Exposes `test_utils` — `new_test_bastion_vault`, the seal helpers and the
# `test_*_api` request helpers — to `bv-server`, which builds its own HTTP
# harness on top of them. Off by default: these fixtures create vaults on
# disk and shell out to the `bvault` binary. Same arrangement `bv-storage`
# uses for its backend fixtures (Phase 1).
test-support = ["bv-storage/test-support", "bv-kernel/test-support"]
sync_handler = [
    "maybe-async/is_sync",
    "bv-storage/sync_handler",
    "bv-logical/sync_handler",
    "bv-utils/sync_handler",
    "bv-audit/sync_handler",
    "bv-kernel-api/sync_handler",
    "bv-engine-pki/sync_handler",
    "bv-engine-transit/sync_handler",
    "bv-engine-cert-lifecycle/sync_handler",
    "bv-engine-ldap/sync_handler",
    "bv-engine-ssh/sync_handler",
    "bv-engine-ssh-broker/sync_handler",
    "bv-engine-totp/sync_handler",
    "bv-engine-kv/sync_handler",
    "bv-engine-notifications/sync_handler",
    "bv-engine-files/sync_handler",
    "bv-engine-resource/sync_handler",
    "bv-engine-rustion/sync_handler",
    "bv-auth-audit/sync_handler",
    "bv-auth-approle/sync_handler",
    "bv-auth-userpass/sync_handler",
    "bv-auth-ferrogate/sync_handler",
    "bv-auth-saml/sync_handler",
    "bv-auth-oidc/sync_handler",
    "bv-auth-fido2/sync_handler",
    "bv-auth-cert/sync_handler",
]
# Cloud Storage Targets for the Encrypted File backend.
# See `features/cloud-storage-backend.md`. Default build stays lean —
# operators who don't need cloud targets pay no compile / binary cost.
cloud_s3 = ["bv-storage/cloud_s3"]
# OneDrive target pulls no new external deps — reuses `ureq` for HTTP,
# `serde_json` for Graph API JSON, and the shared OAuth infra from
# `file/oauth.rs`. The feature flag still exists so operators who
# don't need OneDrive can opt out of compiling the module + its tests.
cloud_onedrive = ["bv-storage/cloud_onedrive"]
# Google Drive target. Like OneDrive, pulls no new external deps —
# reuses `ureq` + `serde_json` + the shared OAuth infra.
cloud_gdrive = ["bv-storage/cloud_gdrive"]
# Dropbox target. Zero new external deps — reuses `ureq` +
# `serde_json` + the shared OAuth infra.
cloud_dropbox = ["bv-storage/cloud_dropbox"]
cloud_keychain = ["bv-storage/cloud_keychain"]
cloud_targets = ["cloud_s3", "cloud_onedrive", "cloud_gdrive", "cloud_dropbox", "cloud_keychain"]
# PKI Phase 3 — composite / hybrid signatures (ECDSA-P256 + ML-DSA-65).
# Off by default. The IETF draft `draft-ietf-lamps-pq-composite-sigs`
# is still moving (random salt, pre-hash construction, OID arc have
# all churned across recent revisions), so the engine ships this as
# an opt-in preview rather than a stable interop guarantee. See
# `features/pki-secret-engine.md`.
pki_pqc_composite = ["bv-engine-pki/pki_pqc_composite"]

# File Resources — SMB sync transport. Off by default because the
# `smb` crate carries its own (pure-Rust) SMB2/3 + NTLM stack and a
# few hundred KiB of compiled code that operators not pushing files
# to a Windows / Samba share don't need to pay for. When enabled,
# `FileSyncTarget { kind = "smb" }` becomes a valid target shape
# whose `target_path` is parsed as `smb://[user@]host[:port]/share/path`.
# See `features/file-resources.md` § "Phase 5 — SMB sync transport".
files_smb = ["bv-engine-files/files_smb"]
# File Resources — SFTP + SCP sync transports. Off by default for the
# same reason as files_smb: the SSH stack is multi-MiB of compiled
# code that operators not pushing files over SSH don't need to pay
# for. Enabling adds `kind = "sftp"` and `kind = "scp"` shapes whose
# `target_path` is `sftp://[user@]host[:port]/path` /
# `scp://[user@]host[:port]/path`. Shares the same russh dep tree
# the planned Resource Connect SSH window will use.
# See `features/file-resources.md` § "Phase 6 — SFTP / SCP sync".
files_ssh_sync = ["bv-engine-files/files_ssh_sync"]

# Transit Secret Engine — Phase 4 follow-ups, both off by default.
#
# `transit_pqc_hybrid` enables the two composite key types:
#   * `hybrid-ed25519+ml-dsa-65` — composite signature, both halves
#     produced over the same domain-prefixed message; verifier needs
#     both to validate. Pulls no new external deps (the components
#     are already in tree).
#   * `hybrid-x25519+ml-kem-768` — KEM combiner per draft-ietf-lamps;
#     the X25519 + ML-KEM shared secrets are concatenated and fed
#     through HKDF-SHA-256 to derive a 32-byte AES-shaped key.
#     Pulls `x25519-dalek` (gated by the same feature).
# Off by default because the IETF lamps `draft-ietf-lamps-pq-composite-{sigs,kem}`
# specs are still moving on the prehash domain + KEM-combiner shape;
# operators who want them today opt in explicitly.
# Forwards to the engine crate: `x25519-dalek` and the `cfg` gates travel
# with the code, which since Phase 3 is `bv-engine-transit`. The root
# manifest keeps the name so an existing `--features transit_pqc_hybrid`
# build command produces the same binary.
transit_pqc_hybrid = ["bv-engine-transit/transit_pqc_hybrid"]
# `transit_byok` enables the BYOK import flow:
#   * `POST /v1/transit/wrapping_key` — engine returns a per-mount
#     ML-KEM-768 public key.
#   * `POST /v1/transit/keys/:name/import_version` — accepts the
#     wrapped 32-byte symmetric key blob, decapsulates with the
#     mount's private wrapping key, and stores the recovered key
#     bytes as a fresh version of the named symmetric key.
# Off by default so the wrapping-key derivation stays inert on
# deployments that don't import key material from outside.
transit_byok = ["bv-engine-transit/transit_byok"]

# SSH Phase 3 — post-quantum SSH certificates (ML-DSA-65). Off by
# default because OpenSSH does not yet ship native support for
# `ssh-mldsa65@openssh.com`, so certs minted under this feature only
# verify in clients that have implemented the draft wire format.
# Operators wiring an ML-DSA-aware Rust SSH client into automation
# pipelines opt in via this flag; everyone else pays nothing. See
# `features/ssh-secret-engine.md` Phase 3.
ssh_pqc = ["bv-engine-ssh/ssh_pqc"]

# HSM Support (features/hsm-support.md). Two mutually-independent backends
# behind the narrow `hsm::HsmBackend` trait, both off by default so the
# stock `cargo build` (and the CLI .deb/.rpm and GUI) pull neither the
# `yubihsm` crate nor its USB stack.
#
# NOTE: the OFFICIAL CONTAINER IMAGE (deploy/container/Containerfile) enables
# BOTH backends so a single image serves production and homologation — the
# active backend is chosen at runtime by the `hsm "<label>"` config block, and
# the mock is fenced off in production by the runtime guard below. Only the
# container image bundles them; every other build path leaves them off.
#
# `hsm_mock` is a pure-software backend (AES-GCM wrap, ed25519 authz,
# p256 identity/ECDH) with a file-persisted object store. Zero new external
# deps — reuses aes-gcm, p256, ed25519-dalek, serde_bytes already in tree.
# It provides NO hardware protection and REFUSES TO START in production
# (BVAULT_ENV=production / environment="production"); it exists for dev, CI,
# and the homologation cluster (no USB passthrough).
hsm_mock = ["bv-core/hsm_mock"]
# `hsm_yubihsm2` is the production backend for the mandated YubiHSM 2, via
# the pure-Rust `yubihsm` crate over the HTTP connector or direct USB.
# The backend itself, its `x509-cert` attestation parsing and its `rusb`
# vendored-libusb build now live in `bv-core` (Phase 4.5 moved `src/hsm/`
# there); this feature only forwards the flag down. `make check-hsm` is what
# compiles the result — nothing else in the workspace does.
hsm_yubihsm2 = ["bv-core/hsm_yubihsm2"]


# ── cargo-machete allowlist ────────────────────────────────────────
#
# `make deps-unused` (cargo-machete) flags a dependency when no `use` of it
# appears in the sources. Every entry below is a dependency that IS needed but
# that a static scan cannot see. Triaged once in Phase 0 of
# roadmaps/workspace-decomposition.md; three genuinely dead deps
# (`foreign-types`, `glob`, `serde_derive`) were dropped in the same pass.
#
# Do not add an entry here to silence the tool. Add it only with a reason that
# says why the scan is wrong.
[package.metadata.cargo-machete]
ignored = [
    # Package name != lib name: the crate is `hcl-rs`, the lib is `hcl`, and the
    # config loader calls `hcl::from_str` / `from_body` / `from_reader`.
    "hcl-rs",
    # Used only through the `#[serde(with = "serde_bytes")]` attribute (see
    # src/hsm/mock.rs), which is a string literal to a static scan.
    "serde_bytes",
    # Package name != lib name again: `smolder-smb-core` exposes `smolder_core`,
    # used by src/modules/files/smb.rs behind the `files_smb` feature.
    "smolder-smb-core",
    # Declared *only* to force libusb's `vendored` feature so the official
    # container image links libusb statically. Intentionally never imported —
    # see the dependency's own comment above.
    "rusb",
    # The next three are direct deps that pin a FEATURE SET for the transitive
    # graph rather than being imported. Removing them would silently change
    # feature unification, not just the manifest:
    #   * tower — `features = ["util"]` for the CMIS gRPC custom connector
    #   * webpki-roots — `default-features = true` for the TLS root store
    #   * rustls-pki-types — pins major 1; consumed via the `rustls::pki_types`
    #     re-export, which is why no direct `use` exists
    "tower",
    "webpki-roots",
    "rustls-pki-types",
]

[lints.clippy]
result_large_err = "allow"
ptr_arg = "allow"
let_and_return = "allow"
should_implement_trait = "allow"
new_without_default = "allow"
field_reassign_with_default = "allow"
# Was "allow", which hid a real deadlock rather than a style nit: it caught
# `Context::wait_task_finish` holding a `MutexGuard` across an `.await` only
# once that code moved into `crates/bv-context`, which does not inherit this
# list. A `std::sync` guard held across an await is not re-entrant and the
# awaiting task cannot release it, so anything the awaited future touches that
# wants the same lock deadlocks — and on the current-thread `actix_rt` runtimes
# this codebase spawns for its sweepers, nothing else can make progress either.
#
# Set to "warn", not "allow", so the class stays visible. The two sites this
# flagged when it was turned on are both fixed — they now drain what they need,
# drop the guard, and only then await:
#   * src/modules/auth/expiration.rs — held the lease-queue write guard across
#     `revoke_lease_id(..).await`, which re-enters that same lock. This was the
#     cause of the intermittent `mod_expiration_tests::*` failures, and of
#     leases not being revoked on schedule.
#   * src/mount.rs — held the mount-table read guard across `table.load(..)`.
# Fix the site rather than silencing it; do not add a local `#[allow]`.
# Not "deny": CI runs no clippy job, so denying would only bite locally.
await_holding_lock = "warn"
too_many_arguments = "allow"
unnecessary_unwrap = "allow"
collapsible_match = "allow"
large_enum_variant = "allow"
unnecessary_map_or = "allow"

# The `bvault` binary, and the deb/rpm packaging metadata that ships it,
# moved to `crates/bvault-cli` in Phase 4 -- a `[[bin]]` shares its package's
# dependencies, so leaving it here would have meant the library depending on
# the CLI that depends on the library. See
# roadmaps/workspace-decomposition.md § Phase 4.


# Phase 2 of the SSH secret engine: target-host helper that PAM's
# `pam_exec` invokes to validate an OTP against `/v1/ssh/verify`.
# Tiny binary, deliberately separate from the server so operators can
# ship it to managed hosts without dragging the full server crate.
[[bin]]
name = "bv-ssh-helper"
path = "bin/bv_ssh_helper.rs"

[[test]]
name = "test_default_logical"
path = "tests/test_default_logical.rs"

[[test]]
name = "cucumber_hiqlite"
harness = false
path = "tests/cucumber_hiqlite.rs"


# ── Dev build speed ────────────────────────────────────────────────
#
# The default dev profile emits *full* DWARF debug info for every
# crate. On this workspace (1200+ deps, Tauri + wry + webview + the PQ
# crypto stack + hiqlite) that debug info dominates both link time and
# `target/` size — a debug `target/` routinely passes 70 GB, most of
# it in `incremental/` and `deps/`.
#
#   * `debug = "line-tables-only"` keeps file/line info (so panic
#     backtraces still name the source location) but drops variable
#     and type debug info. Cuts the debug info the linker has to
#     process roughly in half; step-through debugging in lldb still
#     works, just with fewer local variables resolved.
#   * `split-debuginfo = "unpacked"` leaves debug info in the per-crate
#     `.o` files instead of collecting it into a monolithic dSYM on
#     every link — the single biggest link-time win on macOS.
#   * `build-override` strips debug info from build scripts and
#     proc-macro crates, which are never debugged interactively.
#
# Run `make prune` to reclaim the existing `target/*/incremental` cache
# after switching profiles.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.build-override]
debug = false

[patch.crates-io]
# sspi: hickory-resolver / hickory-proto 0.25 -> 0.26
# (RUSTSEC-2026-0118 NSEC3 proof unbounded loop, RUSTSEC-2026-0119
# O(n^2) name compression CPU exhaustion). Every published sspi still
# requires `hickory ^0.25`, so the advisories cannot be cleared by
# version choice alone. The fork is upstream master (sspi 0.21.4) plus
# exactly one commit porting `src/dns.rs` to the 0.26 resolver API --
# no pin deltas, no other code. Drop this patch once Devolutions
# releases an sspi on hickory 0.26.
#
# hickory reaches us only through sspi's `dns_resolver` feature, which
# IronRDP's `ironrdp-connector` enables for KDC discovery on the
# smartcard CredSSP path.
#
# The picky family is deliberately NOT patched any more. It used to be,
# because picky rc.23 pinned `ed25519-dalek =3.0.0-pre.6` / `rsa
# =0.10.0-rc.17` while russh 0.61.1 wanted `pre.7` / `rc.18`, and the
# picky-asn1 types cross sspi's and ironrdp's public APIs so the whole
# family had to resolve to one source. Published `picky 7.0.0-rc.26`
# requires `ed25519-dalek ^3` and `rsa =0.10.0-rc.18`, which is the
# same line russh 0.62.7 sits on, so the tree now resolves against the
# *stable* ed25519-dalek 3.0.0 with no fork at all. See the russh
# comment in `crates/bv-engine-files/Cargo.toml` for why 0.62.7 in
# particular.
sspi = { git = "https://github.com/ffquintella/sspi-rs", branch = "fix-deps-next" }

# hiqlite raft-client socket-leak fix. Stock hiqlite leaks one ESTABLISHED
# TCP socket per openraft client rebuild: aborting the parent `ws_handler`
# task only *detaches* (does not abort) its spawned reader/writer tasks,
# which keep the upgraded WebSocket's socket halves alive. On the HML cluster
# the follower accumulated ~28k leaked sockets to the leader's raft port
# (8210), exhausted the ephemeral range, and Raft lost quorum ("Cannot assign
# requested address (os error 99)"). Our fork carries a one-struct
# `AbortOnDrop` guard so the child tasks are torn down on every drop path.
#
# Consumed as a git patch (same pattern as the sspi/picky forks above) rather
# than a path patch: hiqlite's repo is itself a Cargo workspace and the crate
# uses `workspace = true` inheritance, which cargo cannot resolve when a path
# patch points inside a nested/excluded workspace. The fork is ALSO checked
# out as a git submodule at `third_party/hiqlite` for local editing — edit
# there on `main-local`, push, then `cargo update -p hiqlite`. Drop this patch
# once the fix is upstreamed (github.com/sebadob/hiqlite).
hiqlite = { git = "https://github.com/ffquintella/hiqlite", branch = "main-local" }
